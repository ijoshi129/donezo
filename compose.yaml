services:
  donezo:
    image: 192.168.1.83:5000/donezo:latest
    container_name: donezo
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4173
    ports:
      - "4173:4173"
    volumes:
      - donezo-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4173/api/tasks').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  donezo-data:
