services:
  donezo:
    # Build from the repo (run: docker compose up -d --build). The image tag is
    # also pushable to a registry if you prefer pulling instead of building.
    build: .
    image: 192.168.1.83:5000/donezo:latest
    container_name: donezo
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4173
      # Optional: sync Apple Reminders -> Donezo over iCloud CalDAV.
      # Uncomment and fill in to enable (off by default). Use an app-specific
      # password from account.apple.com, not your real Apple ID password.
      # ICLOUD_USER: "you@icloud.com"
      # ICLOUD_APP_PASSWORD: "abcd-efgh-ijkl-mnop"
      # ICLOUD_LIST: "Donezo"            # the Reminders list to watch
      # ICLOUD_POLL_SECONDS: "60"
      # ICLOUD_AFTER_IMPORT: "keep"      # keep | complete | delete
    ports:
      - "4173:4173"
    volumes:
      - donezo-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4173/api/tasks').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  donezo-data:
