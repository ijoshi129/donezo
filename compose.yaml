services:
  donezo:
    build: .
    image: donezo:latest
    container_name: donezo
    restart: unless-stopped
    ports:
      - "4173:4173"
    environment:
      # Set this to your timezone so the optional "clear at noon" runs at the right time.
      TZ: America/New_York
    volumes:
      # Your tasks and images live here, on the host. They survive rebuilds.
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/tasks').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
