services:
  donezo:
    # Build from the repo (run: docker compose up -d --build). The image tag is
    # also pushable to a registry if you prefer pulling instead of building.
    build: .
    image: 192.168.1.83:5000/donezo:latest
    container_name: donezo
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4173
      TZ: America/New_York
    ports:
      - "4173:4173"
    volumes:
      # Bind-mount the host data dir so tasks/images persist on the host and
      # survive container rebuilds (no migration needed).
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4173/api/tasks').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
