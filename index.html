<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ecdfc6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1713" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="A fast, swipe-first task manager." />
    <title>Donezo</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/maskable.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..650;1,9..144,400..600&family=Hanken+Grotesk:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar" aria-label="Application toolbar">
        <h1>Donezo</h1>
        <button class="icon-button" id="search-toggle" type="button" aria-label="Search tasks">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
        </button>
        <button class="icon-button" id="settings-toggle" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3.2" />
            <path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.3 1a7.6 7.6 0 0 0-1.7-1l-.4-2.6h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.3-1-2 3.4 2 1.5a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a7.6 7.6 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.6 7.6 0 0 0 1.7-1l2.3 1 2-3.4Z" />
          </svg>
        </button>
      </header>

      <main class="content">
        <section class="composer" id="composer" aria-label="Add a task">
          <form id="task-form" autocomplete="off">
            <label class="sr-only" for="task-input">Task name</label>
            <div class="field-row">
              <input id="task-input" name="task" type="text" maxlength="140" placeholder="New task" />
              <span class="due-field">
                <span class="icon-field-button" id="due-picker" aria-hidden="true">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="4.5" width="18" height="16" rx="2" />
                    <path d="M3 9h18M8 3v3M16 3v3" />
                  </svg>
                </span>
                <input class="due-date-overlay" id="task-due" type="date" aria-label="Set due date" />
              </span>
              <label class="image-picker" for="task-image" aria-label="Attach image">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2" />
                  <circle cx="8.5" cy="10.5" r="1.5" />
                  <path d="m21 15-5-5L5 19" />
                </svg>
              </label>
              <input class="file-input" id="task-image" name="image" type="file" accept="image/*" />
              <button class="submit-button" type="submit" aria-label="Add task">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5v14M5 12h14" />
                </svg>
              </button>
            </div>
            <div class="due-chip" id="new-due-chip" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4.5" width="18" height="16" rx="2" />
                <path d="M3 9h18M8 3v3M16 3v3" />
              </svg>
              <span class="due-chip-label" id="new-due-label"></span>
              <button class="due-chip-remove" id="new-due-remove" type="button" aria-label="Clear due date">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M18 6 6 18M6 6l12 12" />
                </svg>
              </button>
            </div>
            <div class="image-preview" id="new-image-preview" hidden>
              <img alt="" />
              <button class="preview-remove" id="new-image-remove" type="button" aria-label="Remove attached image">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M18 6 6 18M6 6l12 12" />
                </svg>
              </button>
            </div>
          </form>
        </section>

        <section class="search-panel" id="search-panel" aria-label="Search">
          <label class="sr-only" for="search-input">Search tasks</label>
          <input id="search-input" type="search" placeholder="Search tasks" />
        </section>

        <section class="summary" aria-label="Task progress">
          <div class="summary-row">
            <span id="remaining-count">0 left</span>
            <span id="complete-count">0 done</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </section>

        <section class="task-list" id="task-list" aria-live="polite" aria-label="Tasks"></section>

        <p class="empty-state" id="empty-state">Nothing due.</p>
      </main>

      <button class="fab" id="fab" type="button" aria-label="Create a task">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

    <template id="task-template">
      <article class="task-card">
        <div class="task-action task-action-complete" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </div>
        <div class="task-action task-action-delete" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3" />
          </svg>
        </div>
        <div class="task-surface">
          <button class="task-check" type="button" aria-label="Mark complete">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6 9 17l-5-5" />
            </svg>
          </button>
          <div class="task-body">
            <p class="task-title"></p>
            <span class="task-due" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4.5" width="18" height="16" rx="2" />
                <path d="M3 9h18M8 3v3M16 3v3" />
              </svg>
              <span class="task-due-label"></span>
            </span>
            <span class="task-repeat" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M17 2l4 4-4 4" />
                <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
                <path d="M7 22l-4-4 4-4" />
                <path d="M21 13v1a4 4 0 0 1-4 4H3" />
              </svg>
              <span class="task-repeat-label"></span>
            </span>
            <span class="task-tags"></span>
            <button class="task-image-button" type="button" aria-label="View task image" hidden>
              <img alt="" />
            </button>
          </div>
          <button class="task-edit" type="button" aria-label="Edit task">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
          </button>
          <button class="task-delete" type="button" aria-label="Delete task">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3" />
            </svg>
          </button>
        </div>
      </article>
    </template>

    <dialog class="modal" id="task-modal" aria-labelledby="modal-title">
      <form class="modal-panel" id="edit-form" method="dialog" autocomplete="off">
        <div class="modal-header">
          <h2 id="modal-title">Edit task</h2>
          <button class="icon-button" id="modal-close" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>
        <label class="sr-only" for="edit-title">Task name</label>
        <input id="edit-title" type="text" maxlength="140" placeholder="Task name" required />
        <div class="edit-due-row">
          <label class="edit-due-field" for="edit-due">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4.5" width="18" height="16" rx="2" />
              <path d="M3 9h18M8 3v3M16 3v3" />
            </svg>
            <span>Due date</span>
            <input id="edit-due" type="date" aria-label="Due date" />
          </label>
          <button class="due-clear-button" id="edit-due-clear" type="button">Clear</button>
        </div>
        <div class="tag-editor" id="tag-editor">
          <span class="tag-editor-list" id="tag-editor-list"></span>
          <input id="tag-input" class="tag-input" type="text" maxlength="24" placeholder="Add a tag…" aria-label="Add tag" />
        </div>
        <label class="recurrence-row" for="edit-recurrence">
          <span class="recurrence-label">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17 2l4 4-4 4" />
              <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
              <path d="M7 22l-4-4 4-4" />
              <path d="M21 13v1a4 4 0 0 1-4 4H3" />
            </svg>
            <span>Repeat</span>
          </span>
          <select id="edit-recurrence" class="recurrence-select">
            <option value="none">Never</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </label>
        <label class="modal-image-picker" for="edit-image">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <circle cx="8.5" cy="10.5" r="1.5" />
            <path d="m21 15-5-5L5 19" />
          </svg>
          <span>Add or change image</span>
        </label>
        <input class="file-input" id="edit-image" type="file" accept="image/*" />
        <div class="image-preview modal-preview" id="edit-image-preview" hidden>
          <img alt="" />
          <button class="preview-remove" id="edit-image-remove" type="button" aria-label="Remove attached image">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>
        <div class="modal-actions">
          <button class="secondary-button" id="edit-cancel" type="button">Cancel</button>
          <button class="primary-button" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal" id="settings-modal" aria-labelledby="settings-title">
      <div class="modal-panel">
        <div class="modal-header">
          <h2 id="settings-title">Settings</h2>
          <button class="icon-button" id="settings-close" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>
        <label class="setting-row">
          <span class="setting-text">
            <span class="setting-label">Daily reminder</span>
            <span class="setting-hint" id="notif-hint">A push each morning for tasks due today.</span>
          </span>
          <input class="setting-switch" id="setting-notifications" type="checkbox" role="switch" />
        </label>
        <button class="notif-test-button" id="notif-test" type="button">Send a test notification</button>
        <label class="setting-row">
          <span class="setting-text">
            <span class="setting-label">Clear completed at noon</span>
            <span class="setting-hint">Finished tasks are removed daily at 12:00.</span>
          </span>
          <input class="setting-switch" id="setting-auto-clear" type="checkbox" role="switch" />
        </label>
      </div>
    </dialog>

    <dialog class="lightbox" id="image-lightbox" aria-label="Task image preview">
      <img id="lightbox-image" alt="" />
    </dialog>

    <script src="app.js" defer></script>
  </body>
</html>
